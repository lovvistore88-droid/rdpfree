# =============================================================
# SAKUTOPUP FREE RDP - ULTRA PERFORMANCE VERSION (6 JAM)
# =============================================================
# INSTRUKSI PENGGUNAAN:
# 1. Simpan file ini di .github/workflows/main.yml
# 2. Ambil AUTH KEY di Tailscale.com.
# 3. Masukkan ke Settings > Secrets > Actions (Nama: TS_KEY).
# 4. Jalankan via tab ACTIONS.
# =============================================================

name: SAKUTOPUP-FREE-6H-FAST
on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimal GitHub Actions (6 Jam)

    steps:
      - name: 1. System Preparation & Performance Tweaks
        run: |
          # Aktifkan RDP & Buka Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

          # Tweak Performa Windows (Matikan Efek Visual & Animasi)
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fDisableCam" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MinEncryptionLevel" -Value 1 -Force
          
          # Matikan Service Berat yang Nggak Perlu
          Stop-Service -Name "SysMain" -WarningAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled -WarningAction SilentlyContinue
          
          Restart-Service -Name TermService -Force

      - name: 2. Identity Generation (Random)
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "UserSAKU$id"
          
          # Password Generator (Fix Spasi Syntax)
          $sets = @("ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnpqrstuvwxyz", "23456789")
          $p = ""
          foreach ($s in $sets) { 
              $idx = Get-Random -Maximum $s.Length
              $p += $s[$idx] 
          }
          $all = -join $sets
          for ($i=1; $i -le 11; $i++) { 
              $idx = Get-Random -Maximum $all.Length
              $p += $all[$idx] 
          }
          
          echo "SAKU_USER=$u" >> $env:GITHUB_ENV
          echo "SAKU_PASS=$p" >> $env:GITHUB_ENV
          
          net user $u $p /add /y
          net localgroup Administrators $u /add

      - name: 3. Download & Install Software
        run: |
          # Install Google Chrome via Winget
          winget install --id Google.Chrome --silent --accept-source-agreements --accept-package-agreements

          # Coba Install TikTok Live Studio via Winget / Web Fallback
          try {
              winget install --id TikTok.TikTokStudio --silent --accept-source-agreements --accept-package-agreements
          } catch {
              Write-Host "Winget TikTok Studio gagal, menyiapkan link browser..."
          }

          # Pintasan Desktop
          $Desktop = "C:\Users\Public\Desktop"
          $Shell = New-Object -ComObject WScript.Shell
          
          # Shortcut Web TikTok Live Studio (Aman jika offline)
          $ShortcutTTS = $Shell.CreateShortcut("$Desktop\Download TikTok Studio.url")
          $ShortcutTTS.TargetPath = "https://www.tiktok.com/studio/download"
          $ShortcutTTS.Save()

          $ShortcutTT = $Shell.CreateShortcut("$Desktop\TikTok.url")
          $ShortcutTT.TargetPath = "https://www.tiktok.com/"
          $ShortcutTT.Save()

          $ShortcutSaku = $Shell.CreateShortcut("$Desktop\SAKUTOPUP-WEB.url")
          $ShortcutSaku.TargetPath = "https://sakutopup.gamesquad.id/"
          $ShortcutSaku.Save()

      - name: 4. Secure Tunneling
        run: |
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_KEY }} --hostname=SAKU-FREE-6H
          
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "SAKU_IP=$ip" >> $env:GITHUB_ENV

      - name: 5. Access Information & Keep Alive
        run: |
          Write-Host "`n==============================================="
          Write-Host " [ SAKUTOPUP FREE RDP - HIGH PERFORMANCE ]"
          Write-Host "==============================================="
          Write-Host " IP ADDRESS : $env:SAKU_IP"
          Write-Host " USERNAME   : $env:SAKU_USER"
          Write-Host " PASSWORD   : $env:SAKU_PASS"
          Write-Host " DURASI     : 6 JAM (STEALTH)"
          Write-Host "==============================================="
          
          $start = Get-Date
          while ((Get-Date) -lt $start.AddMinutes(355)) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Station Online..."
              Start-Sleep -Seconds 300
          }
          
